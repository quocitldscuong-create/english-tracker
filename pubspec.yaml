name: english_tracker
description: Daily English Learning Schedule Tracker
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Local storage
  shared_preferences: ^2.2.2

  # Local notifications
  flutter_local_notifications: ^17.2.1+2
  timezone: ^0.9.4

  # URL launcher for YouTube links
  url_launcher: ^6.2.5

  # Icons
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
