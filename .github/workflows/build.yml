name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Verify Flutter installation
        run: flutter --version

      - name: Scaffold a complete Flutter project
        run: |
          # Create full Flutter project with all Android boilerplate in /tmp/app
          flutter create \
            --org com.englishtracker \
            --project-name english_tracker \
            --platforms android \
            /tmp/app

          echo "✅ Scaffold created"
          ls /tmp/app

      - name: Overlay our source files onto the scaffold
        run: |
          # Replace lib/ with our code
          rm -rf /tmp/app/lib
          cp -r lib /tmp/app/lib

          # Replace pubspec.yaml with ours
          cp pubspec.yaml /tmp/app/pubspec.yaml

          # Replace AndroidManifest with ours (keep the scaffold's android/ structure)
          cp android/app/src/main/AndroidManifest.xml \
             /tmp/app/android/app/src/main/AndroidManifest.xml

          echo "✅ Source files overlaid"
          ls /tmp/app/lib

      - name: Install dependencies
        working-directory: /tmp/app
        run: flutter pub get

      - name: Analyze code
        working-directory: /tmp/app
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build release APK
        working-directory: /tmp/app
        run: flutter build apk --release --no-shrink

      - name: Show APK info
        run: |
          echo "✅ APK built successfully!"
          ls -lh /tmp/app/build/app/outputs/flutter-apk/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: english-tracker-release-apk
          path: /tmp/app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
