name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Verify Flutter
        run: flutter --version

      - name: Create Flutter scaffold in /tmp/app
        run: |
          flutter create \
            --org com.englishtracker \
            --project-name english_tracker \
            --platforms android \
            /tmp/app

      - name: Overlay our source files
        run: |
          rm -rf /tmp/app/lib
          cp -r $GITHUB_WORKSPACE/lib /tmp/app/lib
          cp $GITHUB_WORKSPACE/pubspec.yaml /tmp/app/pubspec.yaml
          cp $GITHUB_WORKSPACE/android/app/src/main/AndroidManifest.xml \
             /tmp/app/android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        working-directory: /tmp/app
        run: flutter pub get

      - name: Analyze (non-fatal)
        working-directory: /tmp/app
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build APK
        working-directory: /tmp/app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: english-tracker-release-apk
          path: /tmp/app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Done
        run: ls -lh /tmp/app/build/app/outputs/flutter-apk/
